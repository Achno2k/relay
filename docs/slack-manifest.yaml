# Slack app manifest for the agents bot.
# Create the app at https://api.slack.com/apps -> Create New App -> From a manifest,
# paste this, then Install to Workspace. Copy the Bot User OAuth Token (xoxb-)
# and create an App-Level Token (xapp-) with connections:write.
display_information:
  name: agents
  description: Runs coding agents on your EC2 box from Slack threads
features:
  bot_user:
    display_name: agents
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read
      - files:write
settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
