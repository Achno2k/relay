version: 2

project_name: relay

before:
  hooks:
    - sh -c "cd bridge && go mod tidy"

builds:
  - id: relay
    dir: bridge
    main: ./cmd/relay
    binary: relay
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X relay/internal/api.Version={{ .Version }}

archives:
  - id: relay
    ids: [relay]
    formats: [tar.gz]
    # No version in the asset name so the install script can use the stable
    # /releases/latest/download/<asset> URL.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-snapshot"

release:
  github:
    owner: Achno2k
    name: relay
